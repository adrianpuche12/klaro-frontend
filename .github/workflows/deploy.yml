name: CD — Klaro Frontend (Contabo)

on:
  push:
    branches: [main, develop]

jobs:
  build-and-deploy:
    name: Build imagen y deploy a Contabo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Determinar tag y variables por ambiente
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/belopia/prod" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api.belopia.app" >> "$GITHUB_OUTPUT"
            echo "kc_realm=klaro-prod" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-latest" >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/belopia/dev" >> "$GITHUB_OUTPUT"
            echo "api_url=https://dev-api.belopia.app" >> "$GITHUB_OUTPUT"
            echo "kc_realm=klaro-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: adrianpuche/belopia-frontend:${{ steps.vars.outputs.tag }}
          build-args: |
            EXPO_PUBLIC_API_URL=${{ steps.vars.outputs.api_url }}
            EXPO_PUBLIC_KEYCLOAK_URL=https://keycloak.belopia.app
            EXPO_PUBLIC_KEYCLOAK_REALM=${{ steps.vars.outputs.kc_realm }}

      - name: Deploy en Contabo (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ steps.vars.outputs.compose_dir }}
            docker compose pull
            docker compose up -d
            docker image prune -f
