name: CI — Klaro Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeScript + Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verificar build web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://klaro-backend-production-8383.up.railway.app' }}
          EXPO_PUBLIC_KEYCLOAK_URL: ${{ vars.EXPO_PUBLIC_KEYCLOAK_URL || 'http://62.171.160.238:8095' }}
          EXPO_PUBLIC_KEYCLOAK_REALM: ${{ vars.EXPO_PUBLIC_KEYCLOAK_REALM || 'klaro-dev' }}

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: typecheck
    # Solo en push a develop — no en PRs ni en main
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: Esperar que dev.belopia.app esté disponible
        run: |
          echo "Esperando que Vercel DEV esté listo..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://dev.belopia.app/login)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "DEV disponible"
              exit 0
            fi
            sleep 10
          done
          echo "DEV no respondió en 2 minutos" && exit 1

      - name: Correr tests E2E
        run: npm run test:e2e
        env:
          TEST_BASE_URL: https://dev.belopia.app
          TEST_ADMIN_USER: root.admin
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}

      - name: Subir reporte si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
