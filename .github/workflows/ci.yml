name: CI — Klaro Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeScript + Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests unitarios (jest)
        run: npm run test:unit

      - name: Verificar build web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://klaro-backend-production-8383.up.railway.app' }}
          EXPO_PUBLIC_KEYCLOAK_URL: ${{ vars.EXPO_PUBLIC_KEYCLOAK_URL || 'http://62.171.160.238:8095' }}
          EXPO_PUBLIC_KEYCLOAK_REALM: ${{ vars.EXPO_PUBLIC_KEYCLOAK_REALM || 'klaro-dev' }}

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: typecheck
    # En cada PR (del mismo repo: los forks no reciben secrets) y en push a develop.
    #  - PR: se construye el frontend DEL PR y se sirve en localhost:8081 (origen que ya
    #    acepta el CORS de dev-api; que Keycloak también lo acepte lo prueba el test
    #    "credenciales incorrectas", que no usa secrets). Habla con el backend y Keycloak de DEV.
    #    Riesgo: el backend es el de develop, no el del PR. Un PR de frontend que depende de
    #    un cambio de backend sin mergear falla acá hasta que ese backend llegue a DEV.
    #  - push a develop: prueba lo desplegado en dev.belopia.app (Vercel).
    # Usuarios por rol: secrets E2E_<ROL>_USER / E2E_<ROL>_PASS (ROOT, ENCARGADO, CAJERO,
    # CONTADOR), de la empresa de prueba "e2e-pruebas" de klaro-dev (scripts/e2e/preparar-empresa-e2e.mjs;
    # contraseñas solo en ~/.secrets de Jorge). Sin secrets, los tests del rol se saltean, y en
    # develop eso deja el job en rojo (paso "Ningún test E2E salteado").
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    # Los specs de POS escriben en DEV (turno + venta del cajero de prueba): de a uno.
    concurrency:
      group: e2e-dev
      cancel-in-progress: false
    env:
      E2E_ROOT_USER: ${{ secrets.E2E_ROOT_USER }}
      E2E_ROOT_PASS: ${{ secrets.E2E_ROOT_PASS }}
      E2E_ENCARGADO_USER: ${{ secrets.E2E_ENCARGADO_USER }}
      E2E_ENCARGADO_PASS: ${{ secrets.E2E_ENCARGADO_PASS }}
      E2E_CAJERO_USER: ${{ secrets.E2E_CAJERO_USER }}
      E2E_CAJERO_PASS: ${{ secrets.E2E_CAJERO_PASS }}
      E2E_CONTADOR_USER: ${{ secrets.E2E_CONTADOR_USER }}
      E2E_CONTADOR_PASS: ${{ secrets.E2E_CONTADOR_PASS }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: Construir el frontend del PR (contra DEV)
        if: github.event_name == 'pull_request'
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://dev-api.belopia.app
          EXPO_PUBLIC_KEYCLOAK_URL: https://keycloak.belopia.app
          EXPO_PUBLIC_KEYCLOAK_REALM: klaro-dev

      - name: Servir el frontend del PR en localhost:8081
        if: github.event_name == 'pull_request'
        run: |
          nohup npx --yes serve@14.2.4 -s dist -l 8081 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/login | grep -q 200; then
              echo "Frontend del PR servido en localhost:8081"; exit 0
            fi
            sleep 2
          done
          cat serve.log; echo "No levantó el servidor estático" && exit 1

      - name: Esperar que dev.belopia.app esté disponible
        if: github.event_name == 'push'
        run: |
          echo "Esperando que Vercel DEV esté listo..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://dev.belopia.app/login)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "DEV disponible"
              exit 0
            fi
            sleep 10
          done
          echo "DEV no respondió en 2 minutos" && exit 1

      - name: Correr tests E2E
        run: npm run test:e2e -- --reporter=list,json   # sin html: ver "Subir capturas"
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
          TEST_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://localhost:8081' || 'https://dev.belopia.app' }}

      # En develop no se acepta ningún test salteado: si un secret E2E_* vence o se borra, los
      # tests de ese rol se saltean (test.skip) y el job quedaba verde igual. Acá queda rojo.
      - name: Ningún test E2E salteado en develop
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          node -e "
            const s = require('./e2e-results.json').stats;
            console.log('E2E:', JSON.stringify(s));
            if (s.skipped > 0) {
              console.log('::error::' + s.skipped + ' tests E2E salteados. Revisar los secrets E2E_* (scripts/e2e/preparar-empresa-e2e.mjs).');
              process.exit(1);
            }"

      # NUNCA subir playwright-report/ ni el JSON: el repo es público y el reporte guarda lo que
      # se escribió en los inputs. El "error context" (.md) tiene el valor de cada input, y el
      # index.html lleva embebidos (zip en base64) los pasos `Type "<texto>"`: así se filtraron
      # TEST_ADMIN_PASS (hasta el 04-Nov) y los E2E_*_PASS (05-Nov, rotados). Solo se suben las
      # capturas y los videos del fallo: el campo de contraseña se ve como puntos.
      - name: Subir capturas y videos si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-capturas
          path: |
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 7
